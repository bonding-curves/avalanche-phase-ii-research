[project]
name = "avalanche-phase-ii-research"
version = "0.1.0.dev0"
description = "Reproducible Avalanche economic research and data tools"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "click>=8.2,<9",
  "duckdb>=1.4,<2",
  "jsonschema>=4.25,<5",
  "pandas>=2.2,<3",
]

[project.scripts]
avalanche = "avalanche_research.cli:main"

[project.optional-dependencies]
snowflake = [
    "snowflake-connector-python>=3.15,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avalanche_research"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]
notebook = [
  "bokeh>=3.9,<4",
  "holoviews>=1.23,<2",
  "hvplot>=0.12,<1",
  "ipykernel>=7,<8",
  "jupyterlab>=4.6,<5",
  "nbconvert>=7.17,<8",
  "numpy>=2,<3",
  "panel>=1.9,<2",
  "param>=2.4,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
