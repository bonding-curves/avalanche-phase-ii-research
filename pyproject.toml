[project]
name = "avalanche-phase-ii-research"
version = "0.1.0.dev0"
description = "Reproducible Avalanche economic research and data tools"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "click>=8.2,<9",
  "duckdb>=1.4,<2",
  "jsonschema>=4.25,<5",
]

[project.scripts]
avalanche = "avalanche_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avalanche_research"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
