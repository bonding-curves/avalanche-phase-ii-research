   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3566a3" x="51.59232" y="126.855015" transform="rotate(-0 51.59232 126.855015)">1.</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23354d" x="95.125248" y="125.972515" transform="rotate(-0 95.125248 125.972515)">Objectives</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(277.682688 117.427408)">Choose priorities: lower inflation, a longer issuance horizon,</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(277.682688 133.799185)">and longer staking commitments.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3566a3" x="51.59232" y="198.135015" transform="rotate(-0 51.59232 198.135015)">2.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23354d" x="95.125248" y="197.307203" transform="rotate(-0 95.125248 197.307203)">KPIs</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(277.682688 188.707408)">Measure issuance, duration and participation.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(277.682688 205.079185)">Choose which participation measures are safeguards.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3566a3" x="51.59232" y="269.415015" transform="rotate(-0 51.59232 269.415015)">3.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(95.125248 260.748734)">Acceptance</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(95.125248 276.425671)">thresholds</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(277.682688 259.987408)">Choose the minimum conditions a design must meet.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(277.682688 276.359185)">BCRG’s current thresholds are working assumptions.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3566a3" x="51.59232" y="340.695015" transform="rotate(-0 51.59232 340.695015)">4.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(95.125248 331.974046)">Preference</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(95.125248 347.650984)">weights</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(277.682688 331.267408)">Use utilities and the combined score to rank trade-offs.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #23354d" transform="translate(277.682688 347.639185)">A high combined score can still fail a threshold.</text>
   </g>
  </g>
  <g id="text_13">
