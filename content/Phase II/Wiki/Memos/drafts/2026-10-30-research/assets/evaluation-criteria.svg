  </g>
  <g id="text_14">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536176" x="30.528" y="58.618125" transform="rotate(-0 30.528 58.618125)">Decisions for Workshop 1 · Foundation priorities guide the criteria</text>
  </g>
