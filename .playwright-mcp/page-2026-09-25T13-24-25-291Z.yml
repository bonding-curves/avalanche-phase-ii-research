ference(\"Mean\", stats[\"mean\"], maximum, y) median = self.reference(\"Median\", stats[\"median\"], maximum, y) tooltips = [(\"Statistic\", \"@statistic\"), (\"Duration\", \"@value_weeks{0.00} weeks\")] return (bars * mean.opts(color=\"#D95F02\", line_dash=\"dashed\", line_width=2, tools=[\"hover\"], hover_tooltips=tooltips) * median.opts(color=\"#1B9E77\", line_dash=\"dotted\", line_width=2, tools=[\"hover\"], hover_tooltips=tooltips)).opts( legend_position=\"top_right\", padding=0, xlim=(0, x_maximum), ylim=(0, maximum), ) validation_durations = ValidationDurations(stints=validation_stints.frame(), name=\"Validation durations\") pn.Column(\"One-week bins show the empirical distribution before smoothing or stake weighting.\", pn.Param(validation_durations, parameters=[\"measure\"], show_name=False), validation_durations.view)"
