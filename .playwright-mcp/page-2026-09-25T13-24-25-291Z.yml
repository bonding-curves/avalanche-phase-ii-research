f-stake (%)\" if self.measure == \"Percent\" else \"Cumulative self-stake committed (million AVAX)\" maximum = frame[y].max() x_maximum = (DURATION_BOUNDS_DAYS[1] + DAYS_PER_WEEK - 1) // DAYS_PER_WEEK bars = frame.hvplot.bar(x=\"duration_week\", y=y, hover_cols=[\"duration_interval\", \"stints\", \"stake_avax\", \"stake_millions\", \"stake_share_percent\"], xlabel=\"Validation duration (weeks)\", ylabel=ylabel, title=\"Validator self-stake by commitment duration\", color=\"#3B82B4\", alpha=0.85, height=420, responsive=True) tooltips = [(\"Statistic\", \"@statistic\"), (\"Duration\", \"@value_weeks{0.00} weeks\")] mean = self.reference(\"Mean\", stats[\"mean\"], maximum, y).opts(color=\"#D95F02\", line_dash=\"dashed\", line_width=2, tools=[\"hover\"], hover_tooltips=tooltips) median = self.reference(\"Median\", stats[\"median\"], maximum, y).opts(color=\"#1B9E77\", line_dash=\"dotted\", line_width=2, tools=[\"hover\"], hover_tooltips=tooltips) return (bars * mean * median).opts(legend_position=\"top_right\", padding=0, xlim=(0, x_maximum), ylim=(0, maximum)) stake_by_duration = StakeByDuration(stints=validation_stints.frame(), name=\"Stake by duration\") pn.Column(\"Each bar sums validator self-stake across accepted stints in that duration bin.\", pn.Param(stake_by_duration, parameters=[\"measure\"], show_name=False), stake_by_duration.view)"
