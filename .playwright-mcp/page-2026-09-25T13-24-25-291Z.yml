      - generic [ref=e250]: "DURATION_WEEK_LIMIT = 53 DURATION_BREAKS = range(DURATION_WEEK_LIMIT + 1) class UpgradeDurationMap(pm.Parameterized): stints = pm.DataFrame(precedence=-1) periods = pm.DataFrame(precedence=-1) def frame(self): data = self.stints.loc[ self.stints.structurally_valid, [\"period\", \"duration_weeks\"] ].copy() data[\"duration_bin\"] = pd.cut(data.duration_weeks, DURATION_BREAKS, right=False) order = self.periods.period.tolist() cells = pd.MultiIndex.from_product( [order, data.duration_bin.cat.categories], names=[\"period\", \"duration_bin\"] ) frame = ( data.groupby([\"period\", \"duration_bin\"], observed=False).size() .reindex(cells, fill_value=0).rename(\"stints\").reset_index() ) frame[\"period_total\"] = frame.groupby(\"period\").stints.transform(\"sum\") frame[\"share_percent\"] = 100 * frame.stints / frame.period_total frame[\"duration_week\"] = frame.duration_bin.map(lambda value: value.mid).astype(float) frame[\"duration_interval\"] = frame.duration_bin.astype(str) labels = self.periods.period.str.replace(\"_\", \" \").str.title().tolist() frame[\"period_label\"] = pd.Categorical( frame.period.str.replace(\"_\", \" \").str.title(), labels, ordered=True ) return frame.merge(self.periods, on=\"period\", how=\"left\") def view(self): figure = self.frame().hvplot.heatmap( x=\"duration_week\", y=\"period_label\", C=\"share_percent\", cmap=\"Blues\", clabel=\"Share of period stints (%)\", colorbar=True, hover_cols=[\"period\", \"duration_interval\", \"stints\", \"period_total\", \"starts_utc\", \"ends_utc\"], xlabel=\"Validation duration (weeks)\", ylabel=\"\", title=\"Observed commitment durations by study period\", height=520, responsive=True, ).opts(invert_yaxis=True, xlim=(0, DURATION_WEEK_LIMIT), padding=0) return pn.Column(figure, sizing_mode=\"stretch_width\") duration_by_upgrade = UpgradeDurationMap( stints=upgrade_periods.assigned(), periods=upgrade_periods.frame()[[\"period\", \"starts_utc\", \"ends_utc\"]], name=\"Duration by study period\", ) duration_by_upgrade.view()"
