      - generic [ref=e271]: "import numbers class ValidatorCommitmentComparison(pm.Parameterized): commitments = pm.DataFrame(precedence=-1) def measures(self, rows, start, end): count, nodes = len(rows), rows.node_id.nunique() stake, weeks = rows.stake_avax.sum(), rows.duration_weeks avax_weeks = (rows.stake_avax * weeks).sum() ordered = rows.sort_values(\"duration_weeks\") weighted_median = ordered.loc[ordered.stake_avax.cumsum().ge(stake / 2), \"duration_weeks\"].min() if stake else float(\"nan\") return pd.Series({ \"Protocol window start (UTC)\": start, \"Protocol window end (UTC)\": end, \"Protocol window length (weeks)\": (end - start) / pd.to_timedelta(1, unit=\"W\"), \"Validator commitments\": count, \"Distinct node IDs\": nodes, \"Commitments per node ID\": count / nodes if nodes else float(\"nan\"), \"Gross committed self-stake (AVAX)\": stake, \"Mean self-stake per commitment (AVAX)\": stake / count if count else float(\"nan\"), \"Median self-stake per commitment (AVAX)\": rows.stake_avax.median(), \"Mean commitment duration (weeks)\": weeks.mean(), \"Median commitment duration (weeks)\": weeks.median(), \"Gross committed self-stake-duration (AVAX-weeks)\": avax_weeks, \"Mean self-stake-duration per commitment (AVAX-weeks)\": avax_weeks / count if count else float(\"nan\"), \"Self-stake-weighted mean duration (weeks)\": avax_weeks / stake if stake else float(\"nan\"), \"Self-stake-weighted median duration (weeks)\": weighted_median, }) def frame(self): rows = self.commitments.loc[self.commitments.structurally_valid] periods = upgrade_periods.frame().set_index(\"period\") periods.loc[\"genesis\", \"starts_utc\"] = rows.accepted_at.min() values = {\"All data\": self.measures(rows, rows.accepted_at.min(), periods.loc[\"granite\", \"ends_utc\"])} for era, period in periods.iterrows(): values[era.title()] = self.measures(rows.loc[rows.period.eq(era)], period.starts_utc, period.ends_utc) return pd.DataFrame(values).T.rename_axis(\"Era\").reset_index() @staticmethod def format_value(value): if isinstance(value, pd.Timestamp): return value.strftime(\"%Y-%m-%d %H:%M UTC\") if isinstance(value, numbers.Real): return f\"{value:,.0f}\" if isinstance(value, numbers.Integral) else f\"{value:,.2f}\" return value def view(self): table = pn.widgets.Tabulator(self.frame().map(self.format_value), show_index=False, disabled=True, frozen_columns=[\"Era\"], layout=\"fit_data_table\", sizing_mode=\"stretch_width\") cutoff = self.commitments.loc[self.commitments.structurally_valid, \"accepted_at\"].max() return pn.Column(\"### Validator commitments by protocol era\", table, f\"Data cutoff: {self.format_value(cutoff)}. Granite is partially observed. \" \"Node IDs do not identify operators. Gross stake sums commitments, not simultaneous active stake.\") commitment_comparison = ValidatorCommitmentComparison(commitments=upgrade_periods.assigned()) commitment_comparison.view()"
