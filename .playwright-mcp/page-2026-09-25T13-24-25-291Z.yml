      - generic [ref=e149]: "class ValidationStints(pm.Parameterized): stints = pm.DataFrame(precedence=-1) def __init__(self, **params): params.setdefault(\"stints\", prepare_validation_stints()) super().__init__(**params) def frame(self): return self.stints.copy() def audit(self): data = self.frame() valid = data.structurally_valid masks = [ (\"Source\", \"All accepted\", pd.Series(True, index=data.index), \"Every accepted validator staking transaction\"), (\"Exclusion\", \"Missing core field\", data[CORE_STINT_FIELDS].isna().any(axis=1), \"Required analytical field is null\"), (\"Exclusion\", \"Duplicate transaction\", data.transaction_hash.duplicated(keep=False), \"Transaction hash is not unique\"), (\"Exclusion\", \"Invalid chronology\", data.start_time.ge(data.end_time), \"Start is not earlier than end\"), (\"Exclusion\", \"Invalid duration\", ~data.duration_days.between(*DURATION_BOUNDS_DAYS), \"Duration is outside protocol bounds\"), (\"Exclusion\", \"Invalid stake\", data.stake_avax.le(0), \"Self-stake is not positive\"), (\"Exclusion\", \"Invalid fee\", ~data.delegation_fee_rate.between(*DELEGATION_FEE_BOUNDS), \"Fee is outside protocol bounds\"), (\"Partition\", \"Structurally invalid\", ~valid, \"Fails at least one structural check\"), (\"Partition\", \"Pending\", data.outcome_state.eq(\"pending\"), \"Reward state is not yet observed\"), (\"Partition\", \"Rewarded\", data.outcome_state.eq(\"rewarded\"), \"Completed with a positive reward decision\"), (\"Partition\", \"Unrewarded\", data.outcome_state.eq(\"unrewarded\"), \"Completed without a reward\"), (\"Analysis\", \"Duration-choice population\", valid, \"Valid commitments, including pending stints\"), (\"Analysis\", \"Reward-state population\", valid & data.rewarded.notna(), \"Valid commitments with observed reward state\"), (\"Data gap\", \"Missing potential reward\", data.potential_reward_avax.isna(), \"Potential reward is unavailable\"), ] rows = [] for kind, population, mask, rule in masks: selected = data.loc[mask] rows.append((kind, population, len(selected), len(selected) / len(data), selected.node_id.nunique(), selected.accepted_at.min(), selected.accepted_at.max(), rule)) return pd.DataFrame(rows, columns=[ \"kind\", \"population\", \"rows\", \"share\", \"nodes\", \"accepted_from\", \"accepted_to\", \"rule\", ]) def view(self): return pn.widgets.Tabulator( self.audit(), show_index=False, disabled=True, frozen_columns=[\"kind\", \"population\"], layout=\"fit_data_table\", sizing_mode=\"stretch_width\", ) validation_stints = ValidationStints(name=\"Validation stints\") validation_stints.view()"
