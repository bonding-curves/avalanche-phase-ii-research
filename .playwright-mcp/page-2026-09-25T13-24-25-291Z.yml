    - paragraph [ref=e245]: Within each study period, what share of accepted validator stints chose each commitment duration? All Apricot protocol phases are combined into one row, while the exact phase remains in the underlying data. Each row is normalized independently. Period labels identify observation windows, not causal effects; the first and final periods have incomplete data boundaries.
