      - generic [ref=e716]: "LEDGER_DATASET = \"derived.avax-monetary-daily\" WEI_PER_AVAX = 10**18 class CommitmentsWithSupply(pm.Parameterized): \"\"\"The era table above with realized total supply, active stake, and the two staking ratios (D1, D2, D5, D6 in the monetary ledger plan). Each day is observed at 23:59:59 UTC and belongs to the era holding that instant. Supply is the ledger's realized close, written only for checked days, and stake is checked over more days than supply, so each mean covers the days shown in its coverage column.\"\"\" comparison = pm.ClassSelector(class_=ValidatorCommitmentComparison, precedence=-1) def daily(self): with datasets.connect() as connection: return connection.execute(f\"\"\" SELECT date_utc::TIMESTAMP + INTERVAL '23:59:59' AS observed_at, total_supply_close_wei::DOUBLE / {WEI_PER_AVAX} AS supply_avax, CASE WHEN stake_coverage = 'complete' THEN active_validator_stake_wei::DOUBLE / {WEI_PER_AVAX} END AS validator_stake_avax, CASE WHEN stake_coverage = 'complete' THEN active_delegated_stake_wei::DOUBLE / {WEI_PER_AVAX} END AS delegated_stake_avax, active_validator_stake_wei::DOUBLE / total_supply_close_wei::DOUBLE AS validator_ratio, (active_validator_stake_wei + active_delegated_stake_wei)::DOUBLE / total_supply_close_wei::DOUBLE AS combined_ratio FROM avax_monetary_daily \"\"\").fetchdf() def frame(self): table, daily = self.comparison.frame(), self.daily() added = [] for start, end in zip(table[\"Protocol window start (UTC)\"], table[\"Protocol window end (UTC)\"]): days = daily.loc[daily.observed_at.ge(start) & daily.observed_at.lt(end)] checked, staked = days.dropna(subset=[\"supply_avax\"]), days.dropna(subset=[\"validator_stake_avax\"]) added.append({ \"Mean total supply (AVAX)\": checked.supply_avax.mean(), \"Mean validator stake (AVAX)\": staked.validator_stake_avax.mean(), \"Mean delegator stake (AVAX)\": staked.delegated_stake_avax.mean(), \"Mean validator staking ratio (%)\": 100 * checked.validator_ratio.mean(), \"Mean combined staking ratio (%)\": 100 * checked.combined_ratio.mean(), \"Days with checked supply\": f\"{len(checked):,} of {len(days):,}\", \"Days with checked stake\": f\"{len(staked):,} of {len(days):,}\", }) return pd.concat([table, pd.DataFrame(added)], axis=1) def view(self): run = datasets.receipt(LEDGER_DATASET)[\"run\"] table = pn.widgets.Tabulator(self.frame().map(self.comparison.format_value), show_index=False, disabled=True, frozen_columns=[\"Era\"], layout=\"fit_data_table\", sizing_mode=\"stretch_width\") return pn.Column(\"### Validator commitments by protocol era, with supply and staking ratio\", table, f\"Supply and stake from `{LEDGER_DATASET}`, run `{run}`. Total supply is realized: genesis plus rewards paid \" \"minus burns on the P-, X-, and C-Chains, never the P-Chain protocol counter. Validator stake is the self-stake of \" \"active validators and delegator stake the stake delegated to them, in total, not per validator. The validator \" \"ratio is validator stake over supply, and the combined ratio adds delegator stake. Each is the mean of daily \" \"readings at 23:59:59 UTC, over the days its coverage column counts.\") commitments_with_supply = CommitmentsWithSupply(comparison=commitment_comparison) commitments_with_supply.view()"
