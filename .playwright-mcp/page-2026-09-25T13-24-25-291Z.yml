      - generic [ref=e230]: "from avalanche_research.model.protocol import MAINNET_UPGRADES APRICOT_PERIOD = \"apricot\" class UpgradePeriods(pm.Parameterized): stints = pm.DataFrame(precedence=-1) def assigned(self): with datasets.connect() as connection: lookup = connection.execute( \"SELECT transaction_hash, regime FROM staking_periods WHERE role = 'validator'\" ).fetchdf() rows = self.stints.merge(lookup, on=\"transaction_hash\", how=\"left\", validate=\"one_to_one\") if rows.regime.isna().any(): raise ValueError(\"Some validator stints lack a checked upgrade-period assignment\") rows[\"period\"] = rows.regime.mask( rows.regime.str.startswith(APRICOT_PERIOD), APRICOT_PERIOD ) return rows def frame(self): rows = self.assigned() valid = rows.loc[rows.structurally_valid].copy() valid[\"stake_weeks\"] = valid.stake_avax * valid.duration_weeks counts = rows.groupby(\"period\").transaction_hash.size().rename(\"stints\") stats = valid.groupby(\"period\").agg( valid_stints=(\"transaction_hash\", \"size\"), mean_weeks=(\"duration_weeks\", \"mean\"), median_weeks=(\"duration_weeks\", \"median\"), total_stake_avax=(\"stake_avax\", \"sum\"), mean_stake_avax=(\"stake_avax\", \"mean\"), median_stake_avax=(\"stake_avax\", \"median\"), stake_weeks=(\"stake_weeks\", \"sum\"), ) stats[\"stake_weighted_mean_weeks\"] = stats.stake_weeks / stats.total_stake_avax ordered = valid.sort_values([\"period\", \"duration_weeks\"]) running_stake = ordered.groupby(\"period\").stake_avax.cumsum() half_stake = ordered.groupby(\"period\").stake_avax.transform(\"sum\") / 2 stats[\"stake_weighted_median_weeks\"] = ordered.loc[running_stake.ge(half_stake)].groupby(\"period\").duration_weeks.first() summary = counts.to_frame().join(stats.drop(columns=\"stake_weeks\")).rename_axis(\"period\").reset_index() starts = [(\"genesis\", pd.NaT)] starts += [(u.name, u.activated_at.replace(tzinfo=None)) for u in MAINNET_UPGRADES.upgrades] schedule = pd.DataFrame(starts, columns=[\"period\", \"starts_utc\"]) schedule[\"ends_utc\"] = schedule.starts_utc.shift(-1) schedule[\"period\"] = schedule.period.mask( schedule.period.str.startswith(APRICOT_PERIOD), APRICOT_PERIOD ) schedule = schedule.groupby(\"period\", sort=False).agg( starts_utc=(\"starts_utc\", \"min\"), ends_utc=(\"ends_utc\", \"max\") ).reset_index() schedule[\"duration_weeks\"] = (schedule.ends_utc - schedule.starts_utc) / pd.to_timedelta(1, unit=\"W\") return schedule.merge(summary, on=\"period\", how=\"inner\").round(2) def view(self): return pn.widgets.Tabulator( self.frame(), show_index=False, disabled=True, frozen_columns=[\"period\"], layout=\"fit_data_table\", sizing_mode=\"stretch_width\", ) upgrade_periods = UpgradePeriods(stints=validation_stints.frame(), name=\"Study periods\") upgrade_periods.view()"
