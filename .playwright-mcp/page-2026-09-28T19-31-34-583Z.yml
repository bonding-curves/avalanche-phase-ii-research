    - article [ref=f5e288]:
      - paragraph [ref=f5e289]: This site holds the research BCRG is carrying out for the Avalanche Foundation under the Phase II agreement. The question is how validator and delegator behaviour, the reward design, and protocol changes such as Helicon together determine the network’s economic security. Every page of the site maps to a deliverable in the agreement, so the site shows at a glance what is delivered and what is still to come.
      - heading "Deliverables and their status" [level=2] [ref=f5e290]:
