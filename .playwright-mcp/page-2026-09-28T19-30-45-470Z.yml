        - text: .
      - heading "1. How validators commit, six years of staking" [level=2] [ref=e312]:
        - text: 1. How validators commit, six years of staking
        - link [aria-hidden] [ref=e313] [cursor=pointer]:
          - /url: "#1-how-validators-commit-six-years-of-staking"
      - paragraph [ref=e317]:
        - text: A
        - strong [ref=e318]: commitment
        - text: "is one staking transaction’s period, from its start to its end. The research holds all 57,560 validator commitments and 7,056,798 delegator commitments since September 2020 in one checked table. From Durango to Fortuna the median validator commitment lasted 2.1 weeks, down from about 4.3 weeks before Durango. The typical commitment at that minimum also stakes the minimum, 2,000 AVAX. Short commitments are most of the decisions but little of the capital: 62% to 69% of new validator commitments from Durango to Fortuna, holding 3% to 5% of committed AVAX-days."
