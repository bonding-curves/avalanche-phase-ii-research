      - paragraph [ref=e310]:
        - text: The call planned for 2026-09-25 moved to 2026-10-02. This page carries its results, the answers to the Foundation’s comments on the agenda of 2026-09-25, and what is new since. The terms used here are defined in
        - link "Glossary and Notation" [ref=e311] [cursor=pointer]:
