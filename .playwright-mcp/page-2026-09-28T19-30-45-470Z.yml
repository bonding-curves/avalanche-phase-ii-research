      - paragraph [ref=e394]:
        - text: The median duration falls to 2.1 weeks at Durango and holds there until Granite. Weighted by self-stake, the median falls from 7.0 weeks under Cortina to about 4 weeks from Durango on, so large validators shortened too, but less. Under Granite the median self-stake rises from 2,000 to 14,585 AVAX. Self-stake committed sums every commitment’s stake, so a validator that renews every two weeks is counted at each renewal. It measures decisions, not stake held at one time. The table is built from the 2026-09-19 capture of 57,521 validator commitments by the
        - link "validator rewards notebook" [ref=e395] [cursor=pointer]:
          - /url: ../../.././../../Reference/Notebooks
        - text: ", which runs it and shows it interactively."
      - paragraph [ref=e396]:
        - text: The
        - link "staking-periods notebook" [ref=e397] [cursor=pointer]:
          - /url: ../../.././../../Reference/Notebooks
        - text: "holds four linked views on one time axis: commitments begun by stake, commitments begun by duration, each node’s history as a line coloured by its fee, and the stock of commitments open each week. A selection in one view filters the others."
