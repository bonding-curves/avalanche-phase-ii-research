      - heading "3. Helicon, the first week" [level=2] [ref=e432]:
        - text: 3. Helicon, the first week
        - link [aria-hidden] [ref=e433] [cursor=pointer]:
          - /url: "#3-helicon-the-first-week"
      - paragraph [ref=e437]: "Helicon activated on 2026-09-22 at 15:00 UTC. It allows validator commitments of 48 hours with automatic renewal and raises the uptime requirement to 90% for validations that start after it. By 2026-09-24, 20 validator commitments had begun under the new rules. Two chose 48 hours, both auto-renewed, both at about 2,000 AVAX. The largest new commitments went the other way: two of about 1.75 million AVAX each, for about 198 days. Delegations keep the 14-day minimum. The first full comparison is added here after its run on 2026-09-29."
