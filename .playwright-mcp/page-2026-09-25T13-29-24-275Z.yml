      - generic [ref=f2e306]: "In [4]:"
      - generic [ref=f2e307]: "import numpy as np import holoviews as hv from bokeh.models import DatetimeAxis, FixedTicker, Title from avalanche_research.model.protocol import MAINNET_UPGRADES FEE_CLASSES = {1: \"2%\", 2: \"5%\", 3: \"other\", 4: \"10 to 20%\", 5: \"100%\"} PIXEL_ROWS = 500 PALETTES = { \"fee class\": ({1: \"#1f77b4\", 2: \"#2ca02c\", 3: \"#7f7f7f\", 4: \"#ff7f0e\", 5: \"#d62728\"}, FEE_CLASSES), \"failure\": ({1: \"#9ecae1\", 2: \"#d62728\"}, {1: \"rewarded or open\", 2: \"ended with zero reward\"}), \"open period\": ({1: \"#9ecae1\", 2: \"#ff7f0e\"}, {1: \"closed\", 2: \"open today\"}), } def regimes() -> list[tuple[str, np.datetime64]]: \"\"\"The regimes of the validator rewards notebook: genesis, every apricot phase as one, then each upgrade by name.\"\"\" named = [(\"genesis\", np.datetime64(\"2020-09-21\"))] for item in MAINNET_UPGRADES.upgrades: name = \"apricot\" if item.name.startswith(\"apricot\") else item.name if name != named[-1][0]: named.append((name, np.datetime64(item.activated_at.replace(tzinfo=None)))) return named REGIMES = regimes() def regime_axis(plot, element): \"\"\"The regime names above the frame: a second axis with one fixed tick per regime start and the name as its label. Added once per figure. A hook for the outermost overlay of a chart, not for its image: on every update HoloViews writes the week label onto the first x axis it finds, which is this one once it sits above, and that would grow the axis and push the frame down under the mouse. The overlay's hooks run after that, on every update, so the label is cleared again each time.\"\"\" if \"regime_axis\" in plot.handles: plot.handles[\"regime_axis\"].axis_label = None return ticks = [float(start.astype(\"datetime64[ms]\").astype(np.int64)) for _, start in REGIMES] axis = DatetimeAxis(ticker=FixedTicker(ticks=ticks), major_label_overrides={tick: name for tick, (name, _) in zip(ticks, REGIMES)}, major_label_text_font_size=\"8pt\", major_tick_in=0, major_tick_out=4, axis_line_color=None, major_label_standoff=2) plot.state.above = [axis, *plot.state.above] # nearest the frame, so the subtitle sits under the title and the names sit on the data plot.handles[\"regime_axis\"] = axis # Pan is the drag tool by default and is never named in active_tools: HoloViews re-applies active_tools on every update, # so a named drag tool would undo the box select a person picked in the toolbar the moment a chart redraws. An overlay # with no active_tools of its own gets HoloViews' default, pan and wheel, on every update, so every outermost overlay # names the wheel too. Overlay options are dropped under a multiply, so the outermost one is the one that counts. ACTIVE_TOOLS = [\"wheel_zoom\"] SUBTITLE_STYLE = dict(text_font_size=\"10pt\", text_font_style=\"normal\", text_color=\"#555555\") WEEK_ZERO = np.datetime64(\"2020-09-07\") def subtitle(owner, name: str = \"summary\", box: str | None = None): \"\"\"A hook that keeps the caption under the figure's title in step with parameters on its owner. Line 1 is the summary of what is in view. Line 2 is the box parameter, shown only while it is not empty, between line 1 and the regime names: models in `above` stack outward from the frame, so line 2 goes just inside line 1.\"\"\" def hook(plot, element): text = getattr(owner, name) if \"subtitle\" in plot.handles: plot.handles[\"subtitle\"].text = text else: model = Title(text=text, **SUBTITLE_STYLE) plot.state.add_layout(model, \"above\") plot.handles[\"subtitle\"] = model if box is None: return second = getattr(owner, box) line = plot.handles.get(\"subtitle_box\") if line is None: line = plot.handles[\"subtitle_box\"] = Title(text=\"\", **SUBTITLE_STYLE) above = [model for model in plot.state.above if model is not line] if second: line.text = second above.insert(above.index(plot.handles[\"subtitle\"]), line) if above != list(plot.state.above): plot.state.above = above return hook def caption(owner, name: str = \"summary\", box: str | None = None, on_range=None): \"\"\"An invisible zero-width span whose only job is to carry the caption hook. It is redrawn when a caption parameter changes, so the chart's image is not. It is also where a chart whose main element is an overlay takes its range stream: a stream's source must draw one element.\"\"\" def element(**_): return hv.VSpan(WEEK_ZERO, WEEK_ZERO).opts(alpha=0, hooks=[subtitle(owner, name, box)]) span = hv.DynamicMap(element, streams=[hv.streams.Params(owner, parameters=[name] + ([box] if box else []))]) if on_range is not None: hv.streams.RangeXY(source=span).add_subscriber(on_range) return span DATA_WEEKS = None # (first week, last week) of the staking-period log, set by the first chart that needs it def compact(avax: float) -> str: \"\"\"An AVAX amount short enough for a subtitle: 1,778, 52.3k, 7.9M.\"\"\" if avax >= 1e6: return f\"{avax / 1e6:,.1f}M\" if avax >= 1e4: return f\"{avax / 1e3:,.1f}k\" return f\"{avax:,.0f}\" def week_span(x_range): \"\"\"The visible weeks of a zoomed chart as dates, or None when the view covers the whole history, which the first range event always does.\"\"\" if x_range is None: return None low, high = sorted(pd.Timestamp(v, unit=\"ms\") if isinstance(v, (int, float)) else pd.Timestamp(v) for v in x_range) if DATA_WEEKS is not None and low <= DATA_WEEKS[0] and high >= DATA_WEEKS[1]: return None return (low.strftime(\"%Y-%m-%d\"), high.strftime(\"%Y-%m-%d\")) def bound_ranges(plot, element): \"\"\"Pan and zoom stay inside the data. Each range's bounds are fixed at its first extent, once, so a later redraw does not move them. The week range is shared across a canvas, so the first chart drawn sets the bounds for all.\"\"\" for axis in (\"x_range\", \"y_range\"): handle = plot.handles.get(axis) if handle is not None and handle.bounds is None: handle.bounds = (min(handle.start, handle.end), max(handle.start, handle.end)) class ValidatorLifelines(pm.Parameterized): \"\"\"Every validator node as a row, time as weeks, one categorical colour. Binned in DuckDB, drawn as an image. The rows and every per-node number come from derived.node-table, the periods from the staking-period log it was built from.\"\"\" color_by = pm.Selector(default=\"fee class\", objects=list(PALETTES), doc=\"What the colour of a period means: its delegation fee class, whether it ended with zero reward, or whether it is still open today\") sort_by = pm.Selector(default=\"first stake\", objects=[\"first stake\", \"last end\", \"periods\", \"stake-days\"], doc=\"The order of the rows from the top: by the node's first stake, its last end, its number of periods, or its stake-days, stake times days summed over its periods\") first_stake_year = pm.Selector(default=\"all\", objects=[\"all\", *range(2020, 2027)], doc=\"Keep only nodes whose first period started in this year\") active_only = pm.Boolean(False, doc=\"Keep only nodes the node table marks active: a period still open at its capture\") visible = pm.Tuple(default=None, length=2, allow_None=True, precedence=-1, doc=\"Top and bottom of the view as fractions of the sorted nodes, None for all. Written by the zoom.\") weeks_in_view = pm.Tuple(default=None, length=2, allow_None=True, precedence=-1, doc=\"First and last week in the view, None for the whole history. Written by the zoom.\") cohort = pm.Tuple(default=None, length=6, allow_None=True, precedence=-1, doc=\"(axis, week0, week1, low, high, rule): the box a linked grid drew, see cohort_sql\") box_line = pm.String(\"\", precedence=-1, doc=\"Caption line 2, what the box drawn on this chart does, written by a canvas\") probe = pm.Tuple(default=None, length=2, allow_None=True, precedence=-1, doc=\"(x, y) of the last tap that probed a row, None for none\") population = pm.Integer(0, constant=True, precedence=-1, doc=\"Nodes kept by the knobs and the box\") nodes = pm.Integer(0, constant=True, precedence=-1, doc=\"Nodes in view: kept, with a row in the vertical view and a period in the visible weeks\") periods = pm.Integer(0, constant=True, precedence=-1, doc=\"Periods of the nodes in view that overlap the visible weeks\") summary = pm.String(\"\", constant=True, precedence=-1, doc=\"The subtitle: nodes in view of the population, their periods, and the grain\") def __init__(self, db, select=False, height=580, **params): super().__init__(**params) self.db = db self.cache = {} self.select = select self.height = height self.lanes = pd.DataFrame() self.grids = {} self.registered = None self.lanes_table = f\"lifeline_lanes_{id(self)}\" self.db.execute(\"\"\" CREATE OR REPLACE TABLE validator_weeks AS WITH weeks AS (SELECT unnest(generate_series(DATE '2020-09-07', (SELECT max(end_time)::DATE FROM sp WHERE role = 'validator') + 7, INTERVAL 7 DAY))::DATE AS week) SELECT p.node_id, w.week, p.delegation_fee_rate, p.realized_reward_navax = 0 AS failed, p.rewarded_at IS NULL AND p.end_time > now() AS open_period FROM sp p JOIN weeks w ON w.week >= p.start_time::DATE - 6 AND w.week <= p.end_time::DATE WHERE p.role = 'validator' \"\"\") # The node table must describe the same log the periods are drawn from. used = datasets.runs(\"derived.staking-periods\")[0][\"run\"] built_from = {item[\"dataset_id\"]: item[\"run\"] for item in datasets.receipt(\"derived.node-table\")[\"capture\"][\"inputs\"]} assert built_from[\"derived.staking-periods\"] == used, f\"the node table was built from {built_from['derived.staking-periods']}, the log in use is {used}\" self.as_of = pd.Timestamp(self.db.execute(\"SELECT max(as_of) FROM node_table\").fetchone()[0]) global DATA_WEEKS first, last = self.db.execute(\"SELECT min(start_time)::DATE, max(end_time)::DATE FROM sp\").fetchone() DATA_WEEKS = (pd.Timestamp(first), pd.Timestamp(last)) self.update_counts() # The chart the tap points at draws one element. Bands and the today line are overlaid outside, in chart(). self.raster_map = hv.DynamicMap(self.raster_image, streams=[hv.streams.Params(self, parameters=[\"color_by\", \"sort_by\", \"first_stake_year\", \"active_only\", \"cohort\", \"visible\"])]) self.tap = hv.streams.Tap(source=self.raster_map, x=None, y=None) self.tap.add_subscriber(self.on_tap) self.consume_tap = None # a canvas sets this: it returns True when a click was taken to clear a box hv.streams.RangeXY(source=self.raster_map).add_subscriber(self.on_range) # ---------------------------------------------------------------- data methods def node_filter(self) -> str: clauses = [\"TRUE\"] if self.first_stake_year != \"all\": clauses.append(f\"year(first_start) = {self.first_stake_year}\") if self.active_only: clauses.append(\"active\") if self.cohort is not None: clauses.append(self.cohort_sql()) return \" AND \".join(clauses) def cohort_sql(self) -> str: \"\"\"Nodes kept by a box on a linked grid. The box keeps the grid cells whose centre it covers: weeks accepted across, and tenths of a decade of stake or weeks of duration up, exactly as the grids bin them.\"\"\" axis, week0, week1, low, high, rule = self.cohort measure = \"floor(log10(stake_avax) * 10) / 10\" if axis == \"stake\" else \"least(greatest(round(duration_days / 7.0), 1), 52)\" inside = f\"date_trunc('week', accepted_at)::DATE BETWEEN DATE '{week0}' AND DATE '{week1}' AND {measure} BETWEEN {low} AND {high}\" if rule == \"nodes whose first period is in the box\": firsts = \"SELECT node_id, arg_min(stake_avax, accepted_at) AS stake_avax, arg_min(duration_days, accepted_at) AS duration_days, min(accepted_at) AS accepted_at FROM sp WHERE role = 'validator' GROUP BY node_id\" return f\"node_id IN (SELECT node_id FROM ({firsts}) WHERE stake_avax > 0 AND {inside})\" return f\"node_id IN (SELECT node_id FROM sp WHERE role = 'validator' AND stake_avax > 0 AND {inside})\" def node_order(self) -> str: return {\"first stake\": \"first_start, node_id\", \"last end\": \"last_end DESC, node_id\", \"periods\": \"periods DESC, first_start\", \"stake-days\": \"stake_days_avax DESC, first_start\"}[self.sort_by] def class_sql(self) -> str: return { \"fee class\": \"CASE WHEN p.delegation_fee_rate <= 0.0201 THEN 1 WHEN p.delegation_fee_rate <= 0.0501 THEN 2 WHEN p.delegation_fee_rate BETWEEN 0.09 AND 0.21 THEN 4 WHEN p.delegation_fee_rate >= 0.99 THEN 5 ELSE 3 END\", \"failure\": \"CASE WHEN p.failed THEN 2 ELSE 1 END\", \"open period\": \"CASE WHEN p.open_period THEN 2 ELSE 1 END\", }[self.color_by] def lanes_frame(self) -> pd.DataFrame: \"\"\"One row per kept node of the node table in sort order, with its lane from 0. Registered in DuckDB so the grid can join it.\"\"\" key = (self.sort_by, self.first_stake_year, self.active_only, self.cohort) if key not in self.cache: self.cache[key] = self.db.execute(f\"\"\" SELECT node_id, first_start, last_end, active, periods, failed_periods, span_days, tenure_days, current_streak_days, stake_days_avax, latest_stake_avax, latest_fee_rate, rewards_avax, operator_group, (row_number() OVER (ORDER BY {self.node_order()}) - 1)::INTEGER AS lane FROM node_table WHERE {self.node_filter()} ORDER BY lane \"\"\").df() if self.registered != key: self.db.register(self.lanes_table, self.cache[key][[\"node_id\", \"lane\"]]) self.registered = key return self.cache[key] def span(self, count: int) -> tuple[int, int]: \"\"\"The lanes to bin: what is in view plus half a view on each side, so a small pan does not show an edge.\"\"\" if self.visible is None or count == 0: return 0, max(count - 1, 0) first, last = int(self.visible[0] * count), min(count - 1, int(self.visible[1] * count)) margin = (last - first + 1) // 2 return max(0, first - margin), min(count - 1, last + margin) def grid(self) -> tuple[pd.DataFrame, int, int, int]: \"\"\"(grid, first lane, last lane, rows): one row per (pixel row, week) with the colour class, for the lanes in view. Lanes are binned into at most PIXEL_ROWS rows, because an image with more rows than pixels drops rows when drawn. Zooming in bins again over fewer lanes, until each row is one node. Within a row and week the most common fee class wins, but a failure or an open period wins over the rest,