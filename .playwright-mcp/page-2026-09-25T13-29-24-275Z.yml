ndex = np.round(pivot.index, 1) pivot = pivot.reindex(index=buckets, columns=weeks) panels.append(hv.Image((weeks, buckets, pivot.values.astype(float)), kdims=[\"duration (weeks)\", \"log10 stake\"], vdims=[\"periods\"]).opts( cmap=\"viridis\", logz=True, clim=(1, top), width=450, height=300, tools=[\"hover\"], colorbar=True, yticks=ticks, xticks=DURATION_WEEK_TICKS, xlabel=\"duration (weeks)\", ylabel=\"stake (AVAX, log)\", clipping_colors={\"NaN\": (0, 0, 0, 0)}, title=f\"{self.role}s, {era}: {int(part['periods'].sum()):,} periods\", )) return pn.pane.HoloViews(hv.Layout(panels).cols(2), linked_axes=False) @pm.depends(\"periods\") def counters(self): return pn.pane.Markdown(f\"**{self.periods:,}** periods\") def view(self): return pn.Column(pn.Row(pn.Param(self, parameters=[\"role\"]), self.counters), self.view_eras) size_duration = SizeDurationGrid(staking.db) size_duration.view()"
