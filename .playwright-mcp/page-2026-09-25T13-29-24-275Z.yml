    - paragraph [ref=f2e34]: "A staking period is one transaction that locked AVAX for a validator or a delegator: accepted at a block, active from a start time to an end time, with a weight, a potential reward the protocol committed to at acceptance, and, once the period ended, a reward transaction that realised it or not. The derived dataset adds the network upgrade regime at acceptance and the reward the protocol kernel computes for the row from the supply reading before its block. Where kernel and recorded potential reward agree, the row is reproduced."
    - paragraph [ref=f2e35]: The class below takes a DuckDB connection with one view per built dataset and only aggregates. Every data method returns a frame of at most a few thousand rows, and every view draws one of those frames.
