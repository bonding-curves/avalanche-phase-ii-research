  - generic [ref=f2e389]:
    - heading "What to look for in V1" [level=3] [ref=f2e390]
    - list [ref=f2e391]:
      - listitem [ref=f2e392]:
        - code [ref=f2e393]: L1
        - text: Rows are cohorts. 859 nodes first staked in 2020, then 1,315, 1,284, 1,223, 1,501, 1,254, and 208 in 2026. 598 nodes were active at the node table's capture on 2026-09-22 (run
        - code [ref=f2e394]: node-table-2026-09-22b
        - text: ). Their median span is 3.1 years, their median days staked 2.4 years, and their median current streak 0.3 years. All three are lower bounds, because these nodes are still staking.
      - listitem [ref=f2e395]:
        - code [ref=f2e396]: L2
        - text: Exits cluster. 2,095 nodes ended their last period in 2025 and 1,638 in 2024, against 704 in 2023. Sort by last end to see the exit waves against the regime bands.
      - listitem [ref=f2e397]:
        - code [ref=f2e398]: L3
        - text: Fee class is a cohort trait. 2% fees dominate every cohort from 2021 (73 to 84%), but 40% of the 2026 cohort charges 100%, which means they accept no delegation; those are private validators, and their median stake is 16,878 AVAX against 2,000 for the cohorts before.
      - listitem [ref=f2e399]:
        - code [ref=f2e400]: L4
        - text: "Failures are rare and concentrated: 1,296 validator periods ended with zero reward, on 838 nodes. Colour by failure and sort by periods to see whether repeat offenders exist."
      - listitem [ref=f2e401]:
        - code [ref=f2e402]: L5
        - text: 2,224 nodes staked exactly once and 1,537 staked eleven or more times. The one-timers are the thin single bars; the long rows are the operators the network runs on.
      - listitem [ref=f2e403]:
        - code [ref=f2e404]: L6
        - text: "Failures precede exits. Sort by last end and colour by failure: the red segments sit at the right-hand end of lifelines, so a validator's last period before leaving is the one that missed uptime. Whether the failure caused the exit or the exit caused the failure (an operator switching off early) is an open question."
      - listitem [ref=f2e405]:
        - code [ref=f2e406]: L7
        - text: "Cohorts contain batches. Filter to 2024: about two hundred nodes start within days of each other in October 2024 at 2% fee and end together in July 2025, a single operator or service running a fleet. Node ids are not operators; a lifecycle analysis needs an operator key."
  - generic [ref=f2e411]:
    - heading "V2 Arrivals grid" [level=2] [ref=f2e412]
    - paragraph [ref=f2e413]: "A grid of weeks across and stake-size buckets up. Each cell is coloured by one number about the staking periods that were accepted in that week at that size: how many there were, how long they committed for, or, for validators, what share came from nodes staking for the first time. Buckets are a tenth of a decade wide, so every ten rows is a factor of ten in stake. Validators above, delegators below, same weeks, regime bands behind. It is the crowd, not the individuals; V1 holds the individuals."
