) + INTERVAL 7 DAY)::DATE AS week_off FROM sp WHERE role = ? AND duration_days > 0 {kept}), e AS (SELECT class, week_on AS week, 1 AS count, stake_avax AS stake FROM p UNION ALL SELECT class, week_off, -1, -stake_avax FROM p) SELECT class, week, sum(sum(count)) OVER (PARTITION BY class ORDER BY week) AS count, sum(sum(stake)) OVER (PARTITION BY class ORDER BY week) AS stake FROM e GROUP BY class, week ORDER BY class, week \"\"\", [role]).df() classes = [name for name, _ in DURATION_CLASSES] if events.empty: # No period at all, as when a box keeps no node: one week of zeros, so the chart still draws its five areas. self.cache[key] = pd.DataFrame(0.0, columns=pd.MultiIndex.from_product([[\"count\", \"stake\"], classes]), index=pd.DatetimeIndex([\"2020-09-07\"], name=\"week\")) else: weeks = pd.date_range(events[\"week\"].min(), events[\"week\"].max(), freq=\"7D\", name=\"week\") pivot = events.pivot(index=\"week\", columns=\"class\", values=[\"count\", \"stake\"]) pivot.index = pd.to_datetime(pivot.index) frame = pivot.reindex(index=weeks).ffill().fillna(0.0).reindex(columns=pd.MultiIndex.from_product([[\"count\", \"stake\"], classes]), fill_value=0.0) # Adding and subtracting the same stakes leaves float residue of about 1e-7 AVAX where the count is zero. A week with no period has no stake. frame[\"stake\"] = frame[\"stake\"].where(frame[\"count\"] > 0, 0.0).clip(lower=0.0).values self.cache[key] = frame return self.cache[key] def areas(self, role: str, **_): \"\"\"Five areas, always, stacked short class at the bottom. The value dimension stays \"stock\" whatever the weight. The validator stock follows the scope a canvas wrote.\"\"\" column, label = STOCK_WEIGHTS[self.weight] frame = (self.stock(role, *(self.scope or (None, None))) if role == \"validator\" else self.stock(role))[column] if self.share: total = frame.sum(axis=1) frame = frame.div(total.where(total > 0), axis=0).fillna(0.0) weeks = frame.index.values.astype(\"datetime64[ns]\") # Plot options sit on each