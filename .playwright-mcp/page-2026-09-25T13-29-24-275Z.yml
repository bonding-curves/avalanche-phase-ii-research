    - paragraph [ref=f2e621]: "Time goes away. Stake up on the log axis, duration across in weeks rounded to the nearest week, colour by how many periods, one panel per era: before Banff, Banff and Cortina, Durango, and Etna onward. The question is whether big stakes commit longer, and whether the shape changed at an upgrade. One role at a time, because their counts differ a hundredfold; the colour scale is shared across the four panels so eras compare."
