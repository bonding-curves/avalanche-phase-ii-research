    - paragraph [ref=f2e1052]: Checked in a scripted browser on 2026-09-21. The three week ranges stay equal through a zoom on any chart while the vertical ranges stay apart. A box on the stake grid kept 2,725 of 7,641 nodes, a box on the lifelines marked 512 nodes and 6,130 periods, a tap listed a row, a box on the duration grid replaced the stake box and kept 38 nodes, and both the button and the toolbar reset restored the ranges and cleared boxes, marks, and table. No Panel warnings. A grid box redraws the lifelines in about 50 ms and a lifelines box computes its marks in about 35 ms. A re-bin on zoom takes 10 to 20 ms.
