  - generic [ref=f2e703]:
    - heading "What to look for in V2c" [level=3] [ref=f2e704]
    - list [ref=f2e705]:
      - listitem [ref=f2e706]:
        - code [ref=f2e707]: S1
        - text: "Big stakes do not commit longer, they commit differently. The 52-week column runs through every stake size, and the mass at two weeks does too. What changes with size is the share that takes the year: 0.4% of floor validators against 3 to 8% of validators above 100,000 AVAX, peaking at 12% for the 100,000 to 1,000,000 class in Banff and Durango. Medians barely move: 15 to 31 days for small validators, 16 to 86 days for large."
      - listitem [ref=f2e708]:
        - code [ref=f2e709]: S2
        - text: Durango shortened the floor. Validators at the 2,000 AVAX minimum had a median period of about 30 days before Durango and 15 days after. The vertical stripe at four weeks fades after Durango and the two-week column brightens.
      - listitem [ref=f2e710]:
        - code [ref=f2e711]: S3
        - text: "The delegator triangle: large delegations only ever commit short. Above 100,000 AVAX nothing sits beyond 26 weeks in any era, and medians are three to four weeks. Delegations under 2,000 AVAX are two weeks in every era. Duration and size are unrelated for delegators except that the big ones are never long."
      - listitem [ref=f2e712]:
        - code [ref=f2e713]: S4
        - text: "The tiny delegator vanished at Etna. Delegations under 50 AVAX: 108,314 before Banff, 1,299,822 in Banff and Cortina, 2,250,870 in Durango, 21,659 from Etna onward. Under 100 AVAX the fall is from 2.6 million to 34 thousand. The bright cell at 100 to 200 AVAX and two weeks in the Etna panel is what replaced them. Whether this is a fee change, a product change, or the same money in fewer delegations is an open question."
      - listitem [ref=f2e714]:
        - code [ref=f2e715]: S5
        - text: The eras share one colour scale, so a faint panel is a quiet era. Before Banff has 14,798 validator periods and 313,943 delegations; Banff and Cortina have 2.3 million delegations. The delegator crowd arrived with Banff.
      - listitem [ref=f2e716]:
        - code [ref=f2e717]: S6
        - text: "One group-by per role: 11 ms for validators, 44 ms for delegators."
