in self.grid_taps.items(): stream.add_subscriber(lambda x=None, y=None, axis=axis: self.on_click(axis)) self.lifelines.consume_tap = lambda: self.on_click(\"rows\") self.lifelines.param.watch(lambda event: self.param.update(grain=self.lifelines.grain()), [\"visible\", \"cohort\", \"sort_by\"]) self.grain = self.lifelines.grain() # ---------------------------------------------------------------- writers: stream subscribers and one watcher @staticmethod def corners(bounds): x0, y0, x1, y1 = bounds week0, week1 = sorted(pd.Timestamp(v).strftime(\"%Y-%m-%d\") for v in (x0, x1)) low, high = sorted((float(y0), float(y1))) return week0, week1, low, high def on_grid_box(self, axis, bounds=None): if bounds is None: if self.grid_box is not None and self.grid_box[0] == axis: self.apply_grid_box(None) else: week0, week1, low, high = self.corners(bounds) self.apply_grid_box((axis, week0, week1, round(low, 3), round(high, 3))) @pm.depends(\"box_keeps\", watch=True) def reapply(self): self.apply_grid_box(self.grid_box) def apply_grid_box(self, box): \"\"\"The lifelines change first, so everything that reads them after the box is set reads fresh rows. The stock and the lifelines subtitle follow.\"\"\" self.lifelines.cohort = None if box is None else (*box, self.box_keeps) self.set_rows_box(None) self.grid_box = box self.arrivals.box_line = self.durations.box_line = \"\" if box is None: self.stock.scope = None else: axis, week0, week1, low, high = box span = f\"{compact(10 ** low)} to {compact(10 ** (high + 0.1))} AVAX\" if axis == \"stake\" else f\"{max(1, int(np.ceil(low)))} to {min(52, int(np.floor(high)))} weeks\" rule = \"any period\" if self.box_keeps == BOX_RULES[0] else \"first period\" self.lifelines.lanes_frame() self.stock.scope = (self.lifelines.lanes_table, self.lifelines.cohort) # The filter is described on the grid it was drawn on. The lifelines show its effect as their population. owner = self.arrivals if axis == \"stake\" else self.durations owner.box_line = f\"filter: {week0} to {week1}, {span}, {rule}, keeps {self.lifelines.population:,} nodes\" def remember_tools(self, name: str): \"\"\"A hook for a chart's outermost overlay: keeps the figure's box select tool and mirrors whether it is the drag tool into its tags. A tool's `active` exists only in the browser (Bokeh 3.9 has no such Python property), and the toolbar's active_drag keeps its initial value when a person picks another tool. Tags are synced, so a browser callback on the tool's `active` writes the marker.\"\"\" def hook(plot, element): from bokeh.models import BoxSelectTool, CustomJS tool = plot.state.select_one({\"type\": BoxSelectTool}) if tool is None: return self.box_tools[name] = tool if \"change:active\" not in tool.js_property_callbacks: tool.js_property_callbacks = {**tool.js_property_callbacks, \"change:active\": [CustomJS(code=ACTIVE_MARK_JS)]} return hook def on_click(self, name: str) -> bool: \"\"\"A click without a drag while box select is active clears that chart's box and nothing else. True when the click was taken.\"\"\" tool = self.box_tools.get(name) if tool is None or ACTIVE_MARK not in tool.tags: return False self.boxes[name].event(bounds=None) return True def on_rows_box(self, bounds=None): self.set_rows_box(None if bounds is None else bounds) def set_rows_box(self, bounds): if bounds is None: self.marks, self.marked = self.marks.iloc[:0], (0, 0) self.rows_box = None self.lifelines.box_line = \"\" return week0, week1, low, high = self.corners(bounds) low, high = max(0.0, low), min(1.0, high) self.marks, self.marked = self.marked_cells(week0, week1, low, high) self.rows_box = (week0, week1, round(low, 4), round(high, 4)) nodes, periods = self.marked crowded = \" (too many cells to mark, make the box smaller)\" if len(self.marks) > MARK_LIMIT else \"\" # The highlight is described on the lifelines, where it was drawn. self.lifelines.box_line = f\"highlight: {nodes:,} nodes, {periods:,} periods{crowded}\" def clear(self, resetting=None, **_): for stream in self.boxes.values(): stream.event(bounds=None) self.apply_grid_box(None) self.lifelines.probe = None # ---------------------------------------------------------------- data def marked_cells(self, week0, week1, low, high): \"\"\"Grid cells holding a period of the nodes drawn inside the lifelines box: between those heights, with a period overlapping those weeks.\"\"\" nodes = self.lifelines.lanes_at(low, high)[\"node_id\"].tolist() if not nodes: return self.marks.iloc[:0], (0, 0) cells = self.db.execute(\"\"\" WITH chosen AS (SELECT DISTINCT node_id FROM sp WHERE role = 'validator' AND node_id IN (SELECT unnest(?)) AND start_time::DATE <= ?::DATE + 6 AND end_time::DATE >= ?::DATE) SELECT date_trunc('week', accepted_at)::DATE AS week, floor(log10(stake_avax) * 10) / 10 AS bucket, least(greatest(round(duration_days / 7.0), 1), 52)::INTEGER AS duration_weeks, count(*) AS periods, count(DISTINCT node_id) AS nodes FROM sp JOIN chosen USING (node_id) WHERE role = 'validator' AND stake_avax > 0 AND duration_days > 0 GROUP BY 1, 2, 3 \"\"\", [nodes, week1, week0]).df() nodes_marked = int(self.db.execute(\"SELECT count(DISTINCT node_id) FROM sp WHERE role = 'validator' AND node_id IN (SELECT unnest(?)) AND start_time::DATE <= ?::DATE + 6 AND end_time::DATE >= ?::DATE\", [nodes, week1, week0]).fetchone()[0]) return cells, (nodes_marked, int(cells[\"periods\"].sum()) if len(cells) else 0) # ---------------------------------------------------------------- views read def grid_mark(self, axis, grid_box): here = grid_box is not None and grid_box[0] == axis boxes = [(np.datetime64(grid_box[1]), grid_box[3], np.datetime64(grid_box[2]), grid_box[4])] if here else [] return hv.Rectangles(boxes).opts(fill_alpha=0, line_color=BOX_COLOUR, line_width=2) def rows_mark(self, rows_box): boxes = [] if rows_box is None else [(np.datetime64(rows_box[0]), rows_box[2], np.datetime64(rows_box[1]), rows_box[3])] return hv.Rectangles(boxes).opts(fill_alpha=0, line_color=BOX_COLOUR, line_width=2) def cell_marks(self, column, label, rows_box): cells = self.marks[[\"week\", column]].drop_duplicates() if len(cells) > MARK_LIMIT: cells = cells.iloc[:0] frame = pd.DataFrame({\"week\": cells[\"week\"].values.astype(\"datetime64[ns]\"), label: cells[column].astype(float).values}) return hv.Points(frame, kdims=[\"week\", label]).opts(color=\"red\", marker=\"square\", size=4, line_color=\"white\", line_width=0.5) def charts(self): \"\"\"The three charts as one layout, so they share one toolbar and one reset and the dimension \"week\" and nothing else.\"\"\" mine = lambda names: [hv.streams.Params(self, parameters=names)] arrivals = self.arrivals.chart(\"validator\", hv.DynamicMap(functools.partial(self.grid_mark, \"stake\"), streams=mine([\"grid_box\"])), hv.DynamicMap(functools.partial(self.cell_marks, \"bucket\", \"log10 stake\"), streams=mine([\"rows_box\"]))) durations = self.durations.chart(\"validator\", hv.DynamicMap(functools.partial(self.grid_mark, \"duration\"), streams=mine([\"grid_box\"])), hv.DynamicMap(functools.partial(self.cell_marks, \"duration_weeks\", \"duration (weeks)\"), streams=mine([\"rows_box\"]))) lifelines = self.lifelines.chart() * hv.DynamicMap(self.rows_mark, streams=mine([\"rows_box\"])) stock = self.stock.chart(\"validator\") arrivals, durations, lifelines = (chart.opts(active_tools=ACTIVE_TOOLS, hooks=[regime_axis, self.remember_tools(name)]) for chart, name in ((arrivals, \"stake\"), (durations, \"duration\"), (lifelines, \"rows\"))) return (arrivals + durations + lifelines + stock).cols(1).opts(shared_axes=True, toolbar=\"right\") def view(self): charts = pn.pane.HoloViews(self.charts()) button = pn.widgets.Button(name=\"Reset\", button_type=\"warning\", width=80) button.js_on_click(args={\"target\": charts}, code=RESET_JS) button.on_click(lambda event: self.clear()) groups = [group(self, \"Canvas\"), group(self.arrivals, \"Stake grid\"), group(self.durations, \"Duration grid\"), group(self.lifelines, \"Lifelines\"), self.lifel