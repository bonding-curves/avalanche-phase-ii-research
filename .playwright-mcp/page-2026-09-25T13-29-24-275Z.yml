          - cell "Of a 2023 cohort, the rows that reach the dashed today line are a small minority. Retention by cohort is one box away, which is the input a survival curve needs." [ref=f2e1072]
        - row [ref=f2e1073]:
          - cell [ref=f2e1074]:
            - code [ref=f2e1075]: C4
          - 'cell "Boxing stakes above 20,000 AVAX accepted from mid 2024 to early 2025 shows a red block at the bottom of the lifelines: late arrivals with a 100% delegation fee. Checked against the log: the share of nodes whose latest fee is 100% is 0.6% for nodes that first staked in 2020, 0.7% in 2021, 1.1% in 2022, 2.4% in 2023, 4.5% in 2024, 6.9% in 2025, and 41% of the 205 nodes that first staked in 2026. A node at 100% keeps all of its delegators'' rewards, so it is closed to delegation in practice. The newest validators are increasingly not competing for delegators at all, which matters for any model that treats the fee as a price. Who runs them is a question for the Foundation." [ref=f2e1076]'
        - row [ref=f2e1077]:
          - cell [ref=f2e1078]:
            - code [ref=f2e1079]: C5
          - 'cell "A lifelines box around one fleet marks a horizontal stripe on the stake grid and a single row on the duration grid: one stake size, one duration, repeated. A box around independent nodes marks a cloud. The marks separate programmed staking from chosen staking at a glance." [ref=f2e1080]'