          - 'cell "Line 1 is the chart''s own summary of what is in view: nodes of the population, periods, and the row grain on the lifelines, periods accepted in view on the grids, what is open in the last week in view on the stock, named by its week. It follows every zoom, pan, box, and knob. Line 2 appears only on a chart holding a box and says what that box does. Hover the question mark beside a knob for what it does." [ref=f2e885]'
    - paragraph [ref=f2e886]: "Pan is the drag tool by default, and the wheel zooms. Pick box select in the toolbar to draw a box, box zoom to zoom by dragging. Lasso is not offered because both grids and the lifelines are images, and a lasso selects points. The network upgrades are named above each frame, on the same nine regimes the validator rewards notebook uses: genesis, apricot as one, then each upgrade by name."
    - paragraph [ref=f2e887]: "The canvas has three verbs and no others: filter, highlight, and probe, one per gesture. The stock takes no box: the shared week axis is its only dimension, and the zoom already narrows that."
