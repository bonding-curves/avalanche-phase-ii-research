  - generic [ref=f2e598]:
    - heading "What to look for in V2b" [level=3] [ref=f2e599]
    - list [ref=f2e600]:
      - listitem [ref=f2e601]:
        - code [ref=f2e602]: D1
        - text: The diagonals are the protocol's geometry made visible. A delegation must end before its validator's period ends, so as the weeks pass the longest duration still available to a delegator shrinks by one week per week. Every diagonal running down and to the right is one validator's end date, and the delegations that chose to run right up to it. The delegator grid is a picture of validator end dates seen through delegator choices.
      - listitem [ref=f2e603]:
        - code [ref=f2e604]: D2
        - text: "The horizontal lines are round numbers: 2, 4, 13, 26, and 52 weeks. People choose durations by calendar, and the protocol's two-week floor and 52-week cap are the two brightest rows. Validators cluster at 52 weeks and at 2 to 4 weeks with little in between; delegators fill the space between because the diagonals force them to."
      - listitem [ref=f2e605]:
        - code [ref=f2e606]: D3
        - text: Total stake and count disagree at the top. By count the 52-week validator row is faint; by total stake it is the brightest row, at 10^8 AVAX in some weeks. The network's weight commits for a year; its headcount commits for a fortnight.
      - listitem [ref=f2e607]:
        - code [ref=f2e608]: D4
        - text: "Median stake separates the fleets from the rest. The 2024 to 2025 block at 2 to 4 weeks that is bright by count is dark by median stake: many small periods. The bright cells in the median view at 26 and 52 weeks are the large validators renewing."
      - listitem [ref=f2e609]:
        - code [ref=f2e610]: D5
        - text: Delegator behaviour after Durango spreads upward from the two-week row into 2 to 13 weeks, the same shift V2 showed by stake size, now seen by duration.
      - listitem [ref=f2e611]:
        - code [ref=f2e612]: D6
        - text: "One group-by per role: 9 ms for validators, 50 ms for delegators, cached afterwards."
      - listitem [ref=f2e613]:
        - code [ref=f2e614]: D7
        - text: "The bright rows are the protocol's limits and the wallets' menu. The protocol refuses periods shorter than 14 days or longer than 365, so those two rows are the shortest and longest anyone can choose, and people bunch at both. Forty percent of validator periods and 95 percent of delegator periods last 14 to 17 days, the floor plus a buffer. The next peaks are 28 to 31, 90 to 92, 180 to 183, and 365 days: one month, three months, six months, a year, the presets staking interfaces offer. Two thirds of validator periods land within a day of one of those. Periods of a year or more were 9.5 percent of validator periods in 2020 and are 0.9 percent in 2026. The reward curve pays for longer commitment and almost nobody responds to it."
