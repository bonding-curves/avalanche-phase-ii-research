      - generic [ref=f2e892]: "BOX_RULES = [\"nodes with a period in the box\", \"nodes whose first period is in the box\"] MARK_LIMIT = 5000 SIDE = 260 ACTIVE_MARK = \"box-select-active\" ACTIVE_MARK_JS = f\"\"\" const tags = cb_obj.tags.filter((tag) => tag !== \"{ACTIVE_MARK}\") if (cb_obj.active) tags.push(\"{ACTIVE_MARK}\") cb_obj.tags = tags \"\"\" BOX_COLOUR = \"#ff00ff\" # boxes are magenta, marked cells are red, and neither is a fee class or a viridis colour RESET_JS = \"\"\" const figures = [] const walk = (model) => { if (model == null) return if (model.type === \"Figure\") { figures.push(model); return } for (const child of (model.children ?? [])) walk(Array.isArray(child) ? child[0] : child) } walk(target) for (const figure of figures) figure.reset.emit() \"\"\" def group(owner, title: str) -> pn.Param: \"\"\"The default Param panel for one object: its title and every knob it declares, stretched to the side column. State parameters carry precedence=-1 in their class, so they never show. Select and input widgets are 300 wide unless told otherwise.\"\"\" shown = [name for name, item in owner.param.objects().items() if name != \"name\" and (item.precedence is None or item.precedence >= 0)] return pn.Param(owner, name=title, width=SIDE, margin=0, widgets={name: {\"sizing_mode\": \"stretch_width\", \"width\": None} for name in shown}) class LinkedCanvas(pm.Parameterized): \"\"\"V2d: arrivals grid, duration grid, and lifelines on one week axis. Three verbs. Filter: a box on either grid keeps validator nodes by the rule in \"Box keeps\", and every chart redraws with them. Highlight: a box on the lifelines marks those nodes' periods on both grids. Probe: a tap on the lifelines lists a row's nodes. A box is described on its own chart on a second caption line. A click without a drag in box select clears that chart's box. One reset clears the zoom, the boxes, and the probe.\"\"\" box_keeps = pm.Selector(default=BOX_RULES[0], objects=BOX_RULES, doc=\"Which validator