      - generic [ref=f2e729]: "import functools DURATION_CLASSES = [(\"2-4w\", 28), (\"4-8w\", 56), (\"8-16w\", 112), (\"16-32w\", 224), (\"32-52w\", None)] # upper bound in days, exclusive CLASS_COLOURS = dict(zip([name for name, _ in DURATION_CLASSES], [\"#440154\", \"#3b528b\", \"#21918c\", \"#5ec962\", \"#fde725\"])) # viridis, short to long STOCK_WEIGHTS = {\"count\": (\"count\", \"periods active\"), \"stake\": (\"stake\", \"stake active (AVAX)\")} STOCK_CLASS_SQL = \"CASE \" + \" \".join(f\"WHEN duration_days < {bound} THEN '{name}'\" for name, bound in DURATION_CLASSES if bound) + f\" ELSE '{DURATION_CLASSES[-1][0]}' END\" class ActiveStock(pm.Parameterized): \"\"\"V3: periods active per week, stacked by duration class, per role. An interval sweep in DuckDB: +1 at the start week, -1 the week after the end, cumulative sum per class.\"\"\" weight = pm.Selector(default=\"count\", objects=list(STOCK_WEIGHTS), doc=\"What the height means: the number of periods open, or the stake in them\") share = pm.Boolean(False, doc=\"Each week as shares of that week's total, stacked to 100%\") scope = pm.Tuple(default=None, length=2, allow_None=True, precedence=-1, doc=\"(nodes table, tag) that narrows the validator stock, written by a canvas, None for every node\") summary_validator = pm.String(\"\", constant=True, precedence=-1, doc=\"The validator chart's subtitle: periods or stake active in the last week in view\") summary_delegator = pm.String(\"\", constant=True, precedence=-1, doc=\"The delegator chart's subtitle: periods or stake active in the last week in view\") def __init__(self, db, height=260, **params): super().__init__(**params) self.db = db self.cache = {} self.height = height self.maps = {role: hv.DynamicMap(functools.partial(self.areas, role), streams=[hv.streams.Params(self, parameters=[\"weight\", \"share\", \"scope\"])]) for role in (\"validator\", \"delegator\")} self.last_week = {role: None for role in self.maps} for role in self.maps: self.describe(role