  - generic [ref=f2e297]:
    - heading "V1 Validator lifelines" [level=2] [ref=f2e298]
    - paragraph [ref=f2e299]: "One row per validator node, sorted by first stake, x is time in weeks, and each staking period is a bar in the node's row. Colour is one categorical: the delegation fee class, whether the period ended with zero realized reward, or whether it is still open. Network upgrades are the shaded bands, named above the frame. Rows are binned to at most 500 pixel rows, because an image with more rows than pixels silently drops rows; within a row the most common fee class wins, and a failure or an open period wins over the rest. Filter to one cohort year for one node per row. Tap a row to list its nodes and the periods of the node at the tapped height."
    - paragraph [ref=f2e300]:
      - text: The rows, their order, the cohort year, and
      - code [ref=f2e301]: active only
      - text: read
      - code [ref=f2e302]: derived.node-table
      - text: ", one row per node with every per-node number defined once. Active means a period still open at the table's capture, so an active node's span, days staked, and current streak are lower bounds. A tap shows those three clocks for the tapped node. Weeks are the time bin, so re-staking gaps under a week (the median is five hours) do not show as breaks; real exits do."
  - generic [ref=f2e303]:
