          - 'cell "One log holds every staking period: 7,110,868 rows, 57,521 validators and 7,053,347 delegators, each with role, regime, start kind, recorded potential reward, realised reward where a reward row exists, the supply reading before its block, and the kernel reward. Transaction hashes are unique across roles." [ref=f2e267]'
        - row [ref=f2e268]:
          - cell [ref=f2e269]:
            - code [ref=f2e270]: F2
          - cell "Every period accepted before Durango is a pending start, and every period from Durango on starts at acceptance. The regime column makes that visible without a date filter." [ref=f2e271]
        - row [ref=f2e272]:
          - cell [ref=f2e273]:
            - code [ref=f2e274]: F3
          - cell "For the 4,434,628 immediate starts the kernel reproduces the recorded potential reward on all but one row. For the 2,676,119 pending starts it reproduces 515,093 (19%) from the acceptance-block supply, and the share falls with each regime as the pending set grew. Those rows were priced by the protocol later, at their start time, with a later supply, so the acceptance-block reading is the wrong input, not the formula. Reproducing them needs the supply at start time." [ref=f2e275]
        - row [ref=f2e276]:
          - cell [ref=f2e277]:
            - code [ref=f2e278]: F4
          - 'cell "Two disjoint gaps. 121 periods have no supply row: 75 are genesis validators, whose stake sits in the genesis block rather than in a transaction with supply context, and 46 are delegations accepted in the last hours before the supply capture. 120 periods ended before the reward capture without a reward row. None of the 121 is among the 120." [ref=f2e279]'
        - row [ref=f2e280]:
          - cell [ref=f2e281]:
            - code [ref=f2e282]: F5
          - cell "7,078,063 periods have a reward row. 68,003 of them realised zero, which is the uptime failure count, and 32,685 were still open at the reward capture." [ref=f2e283]
