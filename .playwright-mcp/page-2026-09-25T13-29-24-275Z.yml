      - generic [ref=f2e187]: "# The persisted check from `avalanche data check`, and the rule that every interaction stays under 100 ms. import json run = datasets.runs(\"derived.staking-periods\")[0] check = json.loads((run[\"dataset_dir\"] / \"check.json\").read_text()) assert check[\"status\"] == \"pass\", check[\"findings\"] started = time.perf_counter() staking.load() load_ms = round((time.perf_counter() - started) * 1000) timings = {} for name in (\"regimes\", \"reproduction\", \"daily\", \"distribution\", \"provenance\", \"update_totals\"): samples = [] for _ in range(3): started = time.perf_counter() getattr(staking, name)() samples.append((time.perf_counter() - started) * 1000) timings[name] = round(min(samples), 1) slow = {name: ms for name, ms in timings.items() if ms > 100} assert not slow, f\"over 100 ms: {slow}\" summary = check[\"summary\"] pd.DataFrame({ \"value\": { \"rows\": summary[\"rows\"], \"validators\": summary[\"validators\"], \"delegators\": summary[\"delegators\"], \"immediate reproduced\": f\"{summary['immediate_reproduced']:,} of {summary['immediate_rows']:,}\", \"pending reproduced\": f\"{summary['pending_reproduced']:,} of {summary['pending_rows']:,}\", \"without supply row\": summary[\"gap_without_supply_row\"], \"ended without reward row\": summary[\"gap_ended_without_reward_row\"], \"open periods\": summary[\"open_periods\"], \"zero realized\": summary[\"zero_realized\"], \"load into memory ms (once per kernel)\": load_ms, **{f\"{name} ms\": ms for name, ms in timings.items()}, } })"
