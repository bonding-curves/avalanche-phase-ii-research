      - generic [ref=f2e47]: "In [2]:"
      - generic [ref=f2e48]: "class StakingPeriods(pm.Parameterized): \"\"\"Aggregate views over the derived staking-period log. Reads only; the build lives in the client package.\"\"\" role = pm.Selector(default=\"all\", objects=[\"all\", \"validator\", \"delegator\"]) regime = pm.Selector(default=\"all\", objects=[\"all\"]) measure = pm.Selector(default=\"stake_avax\", objects=[\"stake_avax\", \"duration_days\", \"potential_reward_avax\", \"realized_reward_avax\"]) periods = pm.Integer(0, constant=True) stake_avax = pm.Number(0, constant=True) reproduced_share = pm.Number(0, constant=True) def __init__(self, db, **params): super().__init__(**params) self.db = db self.load() self.param[\"regime\"].objects = [\"all\", *self.regimes()[\"regime\"]] self.update_totals() def load(self): \"\"\"Copy the columns the views aggregate into an in-memory table once per kernel, so every redraw scans memory, not Parquet.\"\"\" self.db.execute(\"\"\" CREATE OR REPLACE TABLE sp AS SELECT node_id, role, regime, start_kind, accepted_at, start_time, end_time, duration_days, stake_avax, potential_reward_avax, realized_reward_avax, realized_reward_navax, rewarded_at, delegation_fee_rate, reproduced, kernel_reward_navax IS NOT NULL AS has_kernel FROM staking_periods \"\"\") self.db.execute(\"\"\" CREATE OR REPLACE TABLE sp_totals AS SELECT role, regime, count(*) AS periods, sum(stake_avax) AS stake_avax, count(*) FILTER (WHERE has_kernel) AS with_kernel, count(*) FILTER (WHERE reproduced) AS reproduced FROM sp GROUP BY role, regime \"\"\") # ---------------------------------------------------------------- data methods, each a small frame def where(self, role: bool = True) -> str: clauses = [\"TRUE\"] if role and self.role != \"all\": clauses.append(f\"role = '{self.role}'\") if self.regime != \"all\": clauses.append(f\"regime = '{self.regime}'\") return \" AND \".join(clauses) def regimes(self) -> pd.DataFrame: \"\"\"Regimes in acceptance order with their row counts.\"\"\" return self.db.execute(\"\"\" SELECT regime, min(accepted_at) AS first_accepted, count(*) AS periods FROM sp GROUP BY regime ORDER BY first_accepted \"\"\").df() def reproduction(self) -> pd.DataFrame: \"\"\"Share of rows whose kernel reward equals the recorded potential reward, by regime and start kind.\"\"\" return self.db.execute(\"\"\" SELECT regime, start_kind, count(*) AS periods, avg(CASE WHEN reproduced THEN 1.0 ELSE 0.0 END) AS reproduced_share, min(accepted_at) AS first_accepted FROM sp WHERE has_kernel GROUP BY regime, start_kind ORDER BY first_accepted, start_kind \"\"\").df() def daily(self) -> pd.DataFrame: \"\"\"Periods accepted per day by role, for the current regime selection.\"\"\" return self.db.execute(f\"\"\" SELECT date_trunc('day', accepted_at) AS day, role, count(*) AS periods, sum(stake_avax) AS stake_avax FROM sp WHERE {self.where(role=False)} GROUP BY day, role ORDER BY day \"\"\").df() def distribution(self) -> pd.DataFrame: \"\"\"The selected measure binned in DuckDB on a log10 axis, one row per tenth of a decade.\"\"\" return self.db.execute(f\"\"\" SELECT floor(log10({self.measure}) * 10) / 10 AS log10_value, count(*) AS periods FROM sp WHERE {self.where()} AND {self.measure} > 0 GROUP BY log10_value ORDER BY log10_value \"\"\").df() def provenance(self) -> pd.DataFrame: \"\"\"The derived run and the four input runs it was built from.\"\"\" receipt = datasets.receipt(\"derived.staking-periods\") rows = [{\"dataset\": \"derived.staking-periods\", \"run\": receipt[\"run\"], \"captured_at\": receipt[\"capture\"][\"completed_at\"], \"rows\": receipt[\"build\"][\"summary\"][\"rows\"]}] rows += [{\"dataset\": item[\"dataset_id\"], \"run\": item[\"run\"], \"captured_at\": item[\"captured_at\"], \"rows\": item[\"rows\"]} for item in receipt[\"capture\"][\"inputs\"]] return pd.DataFrame(rows) # ---------------------------------------------------------------- invariant @pm.depends(\"role\", \"regime\", watch=True) def update_totals(self): periods, stake, share = self.db.execute(f\"\"\" SELECT coalesce(sum(periods), 0), coalesce(sum(stake_avax), 0), coalesce(sum(reproduced) / nullif(sum(with_kernel), 0), 0) FROM sp_totals WHERE {self.where()} \"\"\").fetchone() with pm.edit_constant(self): self.periods = int(periods) self.stake_avax = float(stake) self.reproduced_share = float(share) # ---------------------------------------------------------------- instruments @pm.depends(\"role\", \"regime\", \"measure\") def view_distribution(self): return self.distribution().hvplot.bar( x=\"log10_value\", y=\"periods\", title=f\"log10({self.measure}) over {self.periods:,} periods ({self.role}, {self.regime})\", width=620, height=320, xlabel=f\"log10({self.measure})\", rot=90, ) def view_reproduction(self): table = self.reproduction() table[\"label\"] = table[\"regime\"] + \" \" + table[\"start_kind\"] return table.hvplot.bar( x=\"label\", y=\"reproduced_share\", by=\"start_kind\", rot=60, ylim=(0, 1.02), title=\"Kernel reproduces recorded potential reward\", width=620, height=360, ) @pm.depends(\"regime\") def view_daily(self): return self.daily().hvplot.line(x=\"day\", y=\"periods\", by=\"role\", logy=True, title=\"Periods accepted per day\", width=620, height=320) def view_provenance(self): return pn.pane.DataFrame(self.provenance(), index=False, sizing_mode=\"stretch_width\") @pm.depends(\"periods\", \"stake_avax\", \"reproduced_share\") def counters(self): return pn.pane.Markdown(f\"**{self.periods:,}** periods, **{self.stake_avax / 1e6:,.1f}M** AVAX staked, kernel reproduces **{self.reproduced_share:.2%}**\") def view(self): return pn.Column( pn.Row(pn.Column(pn.Param(self, parameters=[\"role\", \"regime\", \"measure\"]), self.counters), self.view_distribution), pn.Row(self.view_daily), self.view_provenance, ) staking = StakingPeriods(datasets.connect()) staking.view()"
