  - generic [ref=f2e494]:
    - heading "What to look for in V2" [level=3] [ref=f2e495]
    - list [ref=f2e496]:
      - listitem [ref=f2e497]:
        - code [ref=f2e498]: A1
        - text: "The floors are bright lines: validators at 2,000 AVAX for the whole history, delegators at 25 AVAX from September 2022. Everything above a floor is a choice."
      - listitem [ref=f2e499]:
        - code [ref=f2e500]: A2
        - text: Delegator behaviour changed twice, and both changes are blocks, not gradients. From Banff to Durango, nearly every delegation under 2,000 AVAX was the minimum two weeks (the dark block in the duration view); after Durango the same crowd commits for two to eight weeks. From January 2025 a bright band appears at 100 to 200 AVAX with its own duration pattern. Blocks with hard edges are products or services, not thousands of independent choices.
      - listitem [ref=f2e501]:
        - code [ref=f2e502]: A3
        - text: Validators above 200,000 AVAX commit for the full year (orange cells) and re-stake on a yearly rhythm; the columns of orange in 2023 and 2024 are those renewals. Small validators sit in the two-to-eight-week classes.
      - listitem [ref=f2e503]:
        - code [ref=f2e504]: A4
        - text: The 2026 validator cohort arrives at 10,000 AVAX and above, not on the floor. That is the fleet and private-validator shift from
        - code [ref=f2e505]: L3
        - text: and
        - code [ref=f2e506]: L7
        - text: ", seen from the arrivals side."
      - listitem [ref=f2e507]:
        - code [ref=f2e508]: A5
        - text: "First-time share is bright in 2020 and 2021 and sparse afterwards: the validator set has been mostly returning nodes since 2022, and new entrants arrive in small clusters that line up with the fleets on V1."
      - listitem [ref=f2e509]:
        - code [ref=f2e510]: A6
        - text: "Each grid is one group-by: 26 ms for validators, 69 ms for delegators, cached afterwards."
  - generic [ref=f2e515]:
